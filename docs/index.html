<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おうち家計簿</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #f7f6f3; --card: #ffffff; --text: #33322e; --sub: #8a887f;
    --line: #e8e6e0; --accent: #7c9070; --accent-dark: #5f7355;
    --income: #4a7fa5; --danger: #b3593e;
    /* カテゴリカラー(固定割当、8色まで。超過分は--cat-otherに集約) */
    --cat-food: #2a78d6; --cat-daily: #1baf7a; --cat-home: #eda100; --cat-utility: #008300;
    --cat-car: #4a3aa7; --cat-transport: #e34948; --cat-medical: #e87ba4; --cat-hobby: #eb6834;
    --cat-other: #898781;
    --saving: #4a3aa7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; background: var(--bg); color: var(--text); font-size: 15px; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 8px 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  button { font: inherit; border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer; background: var(--accent); color: #fff; }
  button.ghost { background: transparent; color: var(--sub); border: 1px solid var(--line); }
  button.danger-link { background: none; color: var(--danger); padding: 2px 6px; font-size: 13px; }
  button.edit-link { background: none; color: var(--accent-dark); padding: 2px 6px; font-size: 13px; }
  input, select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; max-width: 100%; }
  label { font-size: 12px; color: var(--sub); display: block; margin-bottom: 3px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .totals { display: flex; flex-wrap: wrap; gap: 12px; }
  .total-box { flex: 1 1 180px; border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .total-box .cur { font-size: 12px; color: var(--sub); }
  .total-box .amt { font-size: 22px; font-weight: 600; margin: 2px 0; }
  .total-box .sub-line { font-size: 12px; color: var(--sub); }
  .donut-block { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; margin-top: 12px; }
  .donut-wrap { position: relative; width: 180px; height: 180px; flex-shrink: 0; }
  .donut-wrap svg { width: 180px; height: 180px; }
  .donut-slice { cursor: pointer; transition: opacity .12s; }
  .donut-slice:hover { opacity: .85; }
  .donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; }
  .donut-center .amt { font-size: 18px; font-weight: 600; }
  .donut-center .label { font-size: 11px; color: var(--sub); }
  .legend-list { flex: 1; min-width: 200px; }
  .legend-row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 5px 0; }
  .legend-row .swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .legend-row .legend-name { flex-shrink: 0; }
  .legend-row .legend-val { color: var(--sub); margin-left: auto; }
  .legend-pct { color: var(--sub); }
  .donut-tooltip { position: fixed; background: var(--text); color: #fff; font-size: 12px; padding: 5px 9px; border-radius: 6px; pointer-events: none; z-index: 50; display: none; white-space: nowrap; }
  .currency-block { margin-bottom: 18px; }
  .currency-block:last-child { margin-bottom: 0; }
  .currency-block > .cur-label { font-size: 12px; color: var(--sub); margin-bottom: 4px; }
  .savings-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .savings-row:last-child { border-bottom: none; }
  .savings-row .acct-name { font-weight: 600; }
  .savings-row .acct-bal { margin-left: auto; font-weight: 600; color: var(--saving); }
  .tag.saving { background: #ece9f6; color: var(--saving); }
  .saving-amt { color: var(--saving); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--sub); font-weight: normal; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  .income-amt { color: var(--income); font-weight: 600; }
  .items-detail { font-size: 12px; color: var(--sub); margin-top: 3px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: #eef1ea; color: var(--accent-dark); }
  .tag.income { background: #e8f0f6; color: var(--income); }
  .muted { color: var(--sub); font-size: 13px; }
  .table-scroll { overflow-x: auto; }
  #login-view { max-width: 360px; margin: 80px auto; }
  #login-view input { width: 100%; margin-bottom: 10px; }
  #login-view button { width: 100%; }
  .err { color: var(--danger); font-size: 13px; min-height: 18px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; }
  .month-nav { display: flex; align-items: center; gap: 6px; }
  .month-nav .label { font-weight: 600; min-width: 110px; text-align: center; }
  details summary { cursor: pointer; color: var(--accent-dark); font-size: 14px; }
  .search-hit { background: #fbf9f2; }
</style>
</head>
<body>

<div id="login-view" class="card" style="display:none">
  <h1>🍡 おうち家計簿</h1>
  <form id="login-form">
    <label for="login-email">メールアドレス</label>
    <input id="login-email" type="email" autocomplete="username" required>
    <label for="login-password">パスワード</label>
    <input id="login-password" type="password" autocomplete="current-password" required>
    <div class="err" id="login-err"></div>
    <button type="submit" id="login-btn">ログイン</button>
  </form>
</div>

<div id="app-view" class="wrap" style="display:none">
  <div class="topbar">
    <h1>🍡 おうち家計簿</h1>
    <div>
      <button class="ghost" onclick="changePassword()">パスワード変更</button>
      <button class="ghost" onclick="logout()">ログアウト</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div class="month-nav">
        <button class="ghost" onclick="shiftMonth(-1)">◀</button>
        <span class="label" id="month-label"></span>
        <button class="ghost" onclick="shiftMonth(1)">▶</button>
      </div>
      <div><label>&nbsp;</label>
        <select id="f-range" onchange="render()">
          <option value="month">この月</option>
          <option value="all">全期間</option>
        </select>
      </div>
      <div><label>カテゴリ</label>
        <select id="f-category" onchange="render()"><option value="">すべて</option></select>
      </div>
      <div style="flex:1; min-width:180px"><label>検索(品目・店名・メモ)</label>
        <input id="f-search" placeholder="例: 醤油" oninput="render()" style="width:100%">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="totals" id="totals"></div>
    <div class="muted" id="jpy-missing-note" style="margin-top:6px"></div>
    <div id="donut-area"></div>
  </div>

  <div class="card">
    <details id="rate-details">
      <summary>💴 為替レート設定(<span id="rate-month-label"></span>の円換算用)</summary>
      <div class="row" style="margin-top:12px">
        <div><label>USD → JPY(1ドルあたり)</label><input id="rate-usd" type="number" step="0.01" style="width:110px"></div>
        <div><label>KHR → JPY(1リエルあたり)</label><input id="rate-khr" type="number" step="0.0001" style="width:110px"></div>
        <div><button onclick="saveRate()">保存</button></div>
      </div>
      <div class="err" id="rate-err"></div>
    </details>
  </div>

  <div class="card">
    <h2 style="font-size:15px; margin:0 0 8px">🏦 貯蓄・投資の残高(全期間合計)</h2>
    <div id="savings-balances"></div>
  </div>

  <div class="card">
    <details id="add-details">
      <summary id="form-title">➕ 手入力で追加(収入・貯蓄・現金払いなど)</summary>
      <div class="row" style="margin-top:12px">
        <div><label>種別</label>
          <select id="e-type" onchange="onTypeChange()">
            <option value="expense">支出</option>
            <option value="income">収入</option>
            <option value="saving">貯蓄・投資</option>
          </select>
        </div>
        <div><label>日付</label><input id="e-date" type="date"></div>
        <div id="e-store-wrap"><label>店名 / 収入源</label><input id="e-store" placeholder="例: 給与、市場"></div>
        <div id="e-account-wrap" style="display:none"><label>口座名</label><input id="e-account-name" placeholder="例: ABA銀行、米国株"></div>
        <div id="e-direction-wrap" style="display:none"><label>入出金</label>
          <select id="e-direction">
            <option value="deposit">入金(積立)</option>
            <option value="withdraw">出金(引き出し)</option>
          </select>
        </div>
        <div><label>金額</label><input id="e-amount" type="number" step="0.01" style="width:110px"></div>
        <div><label>通貨</label>
          <select id="e-currency"><option>USD</option><option>KHR</option><option>JPY</option></select>
        </div>
        <div><label>カテゴリ</label><select id="e-category-major" onchange="onMajorChange()"></select></div>
        <div><label>内訳</label><select id="e-category-sub"></select></div>
        <div style="flex:1; min-width:140px"><label>メモ</label><input id="e-memo" style="width:100%"></div>
        <div><button onclick="saveEntry()" id="save-btn">追加</button></div>
        <div id="cancel-edit" style="display:none"><button class="ghost" onclick="resetForm()">キャンセル</button></div>
      </div>
      <div class="err" id="entry-err"></div>
    </details>
  </div>

  <div class="card">
    <div id="hit-note" class="muted" style="margin-bottom:8px"></div>
    <div class="table-scroll">
      <table>
        <thead><tr>
          <th>日付</th><th>店 / 内容</th><th>カテゴリ</th><th class="num">金額</th><th></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="donut-tooltip" id="donut-tooltip"></div>

<script>
const SUPABASE_URL = "https://nlzewynymilzhrocygoa.supabase.co";
const SUPABASE_KEY = "sb_publishable_G3n4ny-Rd7O2q0_feOTBjQ_QtD7SsWC";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CATEGORY_STRUCTURE = {
  "食費": ["食料品","朝ご飯","昼ご飯","晩ご飯","外食","カフェ","会食","お酒","その他"],
  "日用雑貨": ["消耗品","その他"],
  "住まい": ["家賃","住宅ローン","修繕・リフォーム","その他"],
  "水道・光熱": ["電気料金","ガス料金","水道料金","その他"],
  "クルマ": ["ガソリン","駐車場","車検・整備","保険","その他"],
  "交通": ["電車","バス","タクシー","飛行機","その他"],
  "医療": ["病院","薬","その他"],
  "趣味・娯楽": ["旅行","書籍","映画・音楽","ゲーム","その他"],
  "教育・教養": ["学費","参考書","セミナー","その他"],
  "通信費": ["携帯電話","インターネット","その他"],
  "衣服・美容": ["衣服","美容","その他"],
  "交際費": ["プレゼント","交際費","その他"],
  "収入": ["給与所得","お小遣い","賞与","副業","その他"],
  "貯蓄・投資": ["貯金","投資","その他"],
  "その他": ["その他"],
};
const CATEGORY_MAJORS = Object.keys(CATEGORY_STRUCTURE);
// 円グラフの固定カラー割当(識別=色。8色まで、それ以外は「その他」に集約して灰色)
const CATEGORY_COLORS = {
  "食費": "#2a78d6", "日用雑貨": "#1baf7a", "住まい": "#eda100", "水道・光熱": "#008300",
  "クルマ": "#4a3aa7", "交通": "#e34948", "医療": "#e87ba4", "趣味・娯楽": "#eb6834",
};
const OTHER_COLOR = "#898781";
const SYM = { USD: "$", KHR: "៛", JPY: "¥" };
const fmt = (amount, cur) => SYM[cur] + Number(amount).toLocaleString(undefined, cur === "KHR" || cur === "JPY" ? {maximumFractionDigits: 0} : {minimumFractionDigits: 2, maximumFractionDigits: 2});

let allRows = [];
let ratesMap = {}; // year_month(YYYY-MM) -> {usd_jpy, khr_jpy}
let viewYear, viewMonth; // month: 1-12
let editingId = null;

// ---------- auth ----------
async function init() {
  const { data: { session } } = await db.auth.getSession();
  if (session) { showApp(); } else { show("login-view"); }
}
function show(id) {
  document.getElementById("login-view").style.display = id === "login-view" ? "block" : "none";
  document.getElementById("app-view").style.display = id === "app-view" ? "block" : "none";
}
document.getElementById("login-form").addEventListener("submit", (e) => {
  e.preventDefault();
  login();
});
async function login() {
  const btn = document.getElementById("login-btn");
  const errEl = document.getElementById("login-err");
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  btn.disabled = true;
  btn.textContent = "ログイン中…";
  errEl.textContent = "";
  try {
    const { error } = await db.auth.signInWithPassword({ email, password });
    if (error) {
      errEl.textContent = error.message === "Invalid login credentials"
        ? "メールアドレスまたはパスワードが違います"
        : "ログインできません: " + error.message;
      return;
    }
    showApp();
  } catch (err) {
    errEl.textContent = "通信エラー: " + (err?.message || err);
  } finally {
    btn.disabled = false;
    btn.textContent = "ログイン";
  }
}
async function logout() { await db.auth.signOut(); location.reload(); }
async function changePassword() {
  const pw = prompt("新しいパスワード(8文字以上):");
  if (!pw) return;
  const { error } = await db.auth.updateUser({ password: pw });
  alert(error ? "変更失敗: " + error.message : "パスワードを変更しました");
}

// ---------- data ----------
async function showApp() {
  show("app-view");
  const now = new Date();
  viewYear = now.getFullYear(); viewMonth = now.getMonth() + 1;
  const catSel = document.getElementById("f-category");
  const entrySel = document.getElementById("e-category-major");
  CATEGORY_MAJORS.forEach(c => {
    catSel.add(new Option(c, c));
    entrySel.add(new Option(c, c));
  });
  onMajorChange();
  document.getElementById("e-date").value = now.toISOString().slice(0, 10);
  await reload();
}
function onMajorChange() {
  const major = document.getElementById("e-category-major").value;
  const subSel = document.getElementById("e-category-sub");
  const prev = subSel.value;
  subSel.innerHTML = "";
  (CATEGORY_STRUCTURE[major] || ["その他"]).forEach(s => subSel.add(new Option(s, s)));
  if ([...subSel.options].some(o => o.value === prev)) subSel.value = prev;
}
function onTypeChange() {
  const type = document.getElementById("e-type").value;
  document.getElementById("e-store-wrap").style.display = type === "saving" ? "none" : "";
  document.getElementById("e-account-wrap").style.display = type === "saving" ? "" : "none";
  document.getElementById("e-direction-wrap").style.display = type === "saving" ? "" : "none";
  if (type === "income") document.getElementById("e-category-major").value = "収入";
  if (type === "saving") document.getElementById("e-category-major").value = "貯蓄・投資";
  onMajorChange();
}
async function reload() {
  const { data, error } = await db.from("kakeibo_transactions")
    .select("id,entry_type,store_name,account_name,purchased_at,purchased_time,amount,currency,category_major,category_sub,items,memo,created_at")
    .order("purchased_at", { ascending: false, nullsFirst: false })
    .order("id", { ascending: false })
    .limit(10000);
  if (error) { alert("データ取得エラー: " + error.message); return; }
  allRows = data;
  await loadRates();
  render();
  renderSavingsBalances();
}
async function loadRates() {
  const { data, error } = await db.from("kakeibo_exchange_rates").select("*");
  if (error) { console.error("rates load error", error); return; }
  ratesMap = {};
  data.forEach(r => { ratesMap[r.year_month] = r; });
}
function rowYearMonth(r) {
  const d = r.purchased_at || r.created_at;
  return d ? d.slice(0, 7) : null;
}
function jpyRateFor(yearMonth, currency) {
  if (currency === "JPY") return 1;
  if (!yearMonth) return null;
  const rec = ratesMap[yearMonth];
  const key = currency === "USD" ? "usd_jpy" : currency === "KHR" ? "khr_jpy" : null;
  return (rec && rec[key] != null) ? Number(rec[key]) : null;
}
function refreshRateForm() {
  const ym = `${viewYear}-${String(viewMonth).padStart(2, "0")}`;
  document.getElementById("rate-month-label").textContent = `${viewYear}年${viewMonth}月`;
  const rec = ratesMap[ym];
  document.getElementById("rate-usd").value = rec?.usd_jpy ?? "";
  document.getElementById("rate-khr").value = rec?.khr_jpy ?? "";
}
async function saveRate() {
  const errEl = document.getElementById("rate-err");
  const ym = `${viewYear}-${String(viewMonth).padStart(2, "0")}`;
  const usd = document.getElementById("rate-usd").value ? parseFloat(document.getElementById("rate-usd").value) : null;
  const khr = document.getElementById("rate-khr").value ? parseFloat(document.getElementById("rate-khr").value) : null;
  const { error } = await db.from("kakeibo_exchange_rates").upsert({ year_month: ym, usd_jpy: usd, khr_jpy: khr, updated_at: new Date().toISOString() });
  if (error) { errEl.textContent = "保存エラー: " + error.message; return; }
  errEl.textContent = "";
  await loadRates();
  render();
}

// ---------- render ----------
function shiftMonth(d) {
  viewMonth += d;
  if (viewMonth === 0) { viewMonth = 12; viewYear--; }
  if (viewMonth === 13) { viewMonth = 1; viewYear++; }
  document.getElementById("f-range").value = "month";
  render();
}
function currentFilterRows() {
  const range = document.getElementById("f-range").value;
  const cat = document.getElementById("f-category").value;
  const q = document.getElementById("f-search").value.trim().toLowerCase();
  return allRows.filter(r => {
    if (range === "month") {
      const d = r.purchased_at || r.created_at.slice(0, 10);
      if (!d.startsWith(`${viewYear}-${String(viewMonth).padStart(2, "0")}`)) return false;
    }
    if (cat && r.category_major !== cat) return false;
    if (q) {
      const hay = [r.store_name, r.memo, r.category_major, r.category_sub, ...(r.items || []).map(i => i.name)].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}
function render() {
  document.getElementById("month-label").textContent = `${viewYear}年${viewMonth}月`;
  refreshRateForm();
  const rows = currentFilterRows();
  const q = document.getElementById("f-search").value.trim().toLowerCase();

  // 集計(通貨別、支出/収入/貯蓄は明確に区別する)
  const totalsEl = document.getElementById("totals");
  totalsEl.innerHTML = "";
  ["USD", "KHR", "JPY"].forEach(cur => {
    const curRows = rows.filter(r => r.currency === cur);
    if (!curRows.length) return;
    const expense = curRows.filter(r => r.entry_type === "expense").reduce((s, r) => s + Number(r.amount), 0);
    const income = curRows.filter(r => r.entry_type === "income").reduce((s, r) => s + Number(r.amount), 0);
    const box = document.createElement("div");
    box.className = "total-box";
    box.innerHTML = `<div class="cur">${cur}</div>
      <div class="amt">${fmt(expense, cur)}</div>
      <div class="sub-line">支出${income ? ` ｜ 収入 ${fmt(income, cur)} ｜ 収支 ${fmt(income - expense, cur)}` : ""}</div>`;
    totalsEl.appendChild(box);
  });

  // 円換算合計(各取引が発生した月のレートを使う。レート未設定分は除外して件数を注記)
  let jpyExpense = 0, jpyIncome = 0, missing = 0, convertedAny = false;
  rows.filter(r => r.entry_type === "expense" || r.entry_type === "income").forEach(r => {
    const rate = jpyRateFor(rowYearMonth(r), r.currency);
    if (rate == null) { missing++; return; }
    convertedAny = true;
    const jpyAmt = Number(r.amount) * rate;
    if (r.entry_type === "expense") jpyExpense += jpyAmt; else jpyIncome += jpyAmt;
  });
  if (convertedAny) {
    const box = document.createElement("div");
    box.className = "total-box";
    box.innerHTML = `<div class="cur">円換算(JPY)</div>
      <div class="amt">${fmt(jpyExpense, "JPY")}</div>
      <div class="sub-line">支出 ｜ 収入 ${fmt(jpyIncome, "JPY")} ｜ 収支 ${fmt(jpyIncome - jpyExpense, "JPY")}</div>`;
    totalsEl.appendChild(box);
  }
  document.getElementById("jpy-missing-note").textContent = missing
    ? `※ ${missing}件はその月の為替レートが未設定のため円換算に含まれていません(下の「為替レート設定」から入力できます)`
    : "";

  if (!totalsEl.innerHTML) totalsEl.innerHTML = '<span class="muted">該当データがありません</span>';

  // カテゴリ内訳の円グラフ(支出のみ、通貨ごとに1枚)
  const donutArea = document.getElementById("donut-area");
  donutArea.innerHTML = "";
  ["USD", "KHR", "JPY"].forEach(cur => {
    const byCat = {};
    rows.filter(r => r.currency === cur && r.entry_type === "expense")
      .forEach(r => { byCat[r.category_major] = (byCat[r.category_major] || 0) + Number(r.amount); });
    const entries = Object.entries(byCat);
    if (!entries.length) return;
    const total = entries.reduce((s, [, amt]) => s + amt, 0);
    const block = document.createElement("div");
    block.className = "currency-block";
    block.innerHTML = `<div class="cur-label">${cur} の支出内訳</div>` + buildDonut(entries, cur, total);
    donutArea.appendChild(block);
  });
  if (!donutArea.innerHTML) donutArea.innerHTML = '<span class="muted">この期間の支出データがありません</span>';

  // 明細テーブル
  const tbody = document.getElementById("rows");
  tbody.innerHTML = "";
  rows.forEach(r => {
    const tr = document.createElement("tr");
    const isIncome = r.entry_type === "income";
    const isSaving = r.entry_type === "saving";
    const matchedItems = q ? (r.items || []).filter(i => (i.name || "").toLowerCase().includes(q)) : [];
    if (matchedItems.length) tr.className = "search-hit";
    const itemsHtml = (r.items || []).length
      ? `<div class="items-detail">${(r.items).map(i =>
          matchedItems.includes(i) ? `<b>${esc(i.name)} ${i.price}</b>` : `${esc(i.name)} ${i.price}`
        ).join(" ／ ")}</div>` : "";
    const nameCell = isSaving
      ? `🏦 ${esc(r.account_name || "(口座未設定)")}<div class="items-detail">${Number(r.amount) < 0 ? "出金" : "入金"}</div>`
      : `${esc(r.store_name || "(不明)")}${r.memo ? `<div class="items-detail">📝 ${esc(r.memo)}</div>` : ""}${itemsHtml}`;
    const amtClass = isIncome ? "income-amt" : isSaving ? "saving-amt" : "";
    const sign = isIncome || (isSaving && Number(r.amount) > 0) ? "+" : "";
    tr.innerHTML = `
      <td style="white-space:nowrap">${r.purchased_at || "-"}${r.purchased_time ? `<div class="items-detail">${r.purchased_time.slice(0, 5)}</div>` : ""}</td>
      <td>${nameCell}</td>
      <td><span class="tag ${isIncome ? "income" : ""} ${isSaving ? "saving" : ""}">${esc(r.category_major)}${r.category_sub && r.category_sub !== "その他" ? " / " + esc(r.category_sub) : ""}</span></td>
      <td class="num ${amtClass}">${sign}${fmt(r.amount, r.currency)}</td>
      <td style="white-space:nowrap">
        <button class="edit-link" onclick="startEdit(${r.id})">編集</button>
        <button class="danger-link" onclick="removeEntry(${r.id})">削除</button>
      </td>`;
    tbody.appendChild(tr);
  });

  // 品目検索のヒット数
  const note = document.getElementById("hit-note");
  if (q) {
    const itemHits = rows.flatMap(r => (r.items || [])
      .filter(i => (i.name || "").toLowerCase().includes(q))
      .map(i => ({ ...i, store: r.store_name, date: r.purchased_at, cur: r.currency })));
    note.textContent = itemHits.length
      ? `「${document.getElementById("f-search").value.trim()}」品目ヒット: ` +
        itemHits.slice(0, 5).map(h => `${h.store || "?"} ${SYM[h.cur] || ""}${h.price}(${h.date || "?"})`).join(" ／ ") +
        (itemHits.length > 5 ? ` 他${itemHits.length - 5}件` : "")
      : `${rows.length}件が店名・メモ・カテゴリでヒット(品目名での一致なし)`;
  } else {
    note.textContent = `${rows.length}件`;
  }
}
function esc(s) { const d = document.createElement("span"); d.textContent = s ?? ""; return d.innerHTML; }

// ---------- 円グラフ(ドーナツ) ----------
function buildDonut(entries, currency, total) {
  // 識別色を持たないカテゴリは「その他」にまとめる(色は8つまで、生成しない)
  const grouped = [];
  let otherAmt = 0;
  entries.forEach(([cat, amt]) => {
    if (CATEGORY_COLORS[cat]) grouped.push([cat, amt, CATEGORY_COLORS[cat]]);
    else otherAmt += amt;
  });
  if (otherAmt > 0) grouped.push(["その他", otherAmt, OTHER_COLOR]);
  grouped.sort((a, b) => b[1] - a[1]);

  const R = 70, CX = 90, CY = 90, STROKE = 26, GAP = 3;
  const C = 2 * Math.PI * R;
  let offset = 0;
  const slices = grouped.map(([cat, amt, color]) => {
    const frac = amt / total;
    const len = Math.max(0, frac * C - GAP);
    const circle = `<circle class="donut-slice" cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${color}" stroke-width="${STROKE}"
      stroke-dasharray="${len} ${(C - len).toFixed(1)}" stroke-dashoffset="${(-offset).toFixed(1)}"
      transform="rotate(-90 ${CX} ${CY})"
      data-tooltip="${esc(cat)}: ${esc(fmt(amt, currency))} (${(frac * 100).toFixed(0)}%)"></circle>`;
    offset += frac * C;
    return circle;
  });

  const legend = grouped.map(([cat, amt, color]) => `
    <div class="legend-row">
      <span class="swatch" style="background:${color}"></span>
      <span class="legend-name">${esc(cat)}</span>
      <span class="legend-val">${fmt(amt, currency)} <span class="legend-pct">(${(amt / total * 100).toFixed(0)}%)</span></span>
    </div>`).join("");

  return `<div class="donut-block">
    <div class="donut-wrap">
      <svg viewBox="0 0 180 180">${slices.join("")}</svg>
      <div class="donut-center"><div class="amt">${fmt(total, currency)}</div><div class="label">合計</div></div>
    </div>
    <div class="legend-list">${legend}</div>
  </div>`;
}

(function setupDonutTooltip() {
  const tip = document.getElementById("donut-tooltip");
  document.addEventListener("mouseover", (e) => {
    const el = e.target.closest?.(".donut-slice");
    if (!el) return;
    tip.textContent = el.getAttribute("data-tooltip");
    tip.style.display = "block";
  });
  document.addEventListener("mousemove", (e) => {
    if (tip.style.display !== "block") return;
    tip.style.left = (e.clientX + 12) + "px";
    tip.style.top = (e.clientY + 12) + "px";
  });
  document.addEventListener("mouseout", (e) => {
    if (e.target.closest?.(".donut-slice")) tip.style.display = "none";
  });
})();

// ---------- 貯蓄・投資の残高(全期間、口座別) ----------
function renderSavingsBalances() {
  const el = document.getElementById("savings-balances");
  const savingRows = allRows.filter(r => r.entry_type === "saving");
  if (!savingRows.length) { el.innerHTML = '<span class="muted">まだ貯蓄・投資の記録がありません。下のフォームから追加できます。</span>'; return; }

  const byAccount = {};
  savingRows.forEach(r => {
    const key = (r.account_name || "(口座未設定)") + "|" + r.currency;
    byAccount[key] = byAccount[key] || { name: r.account_name || "(口座未設定)", currency: r.currency, balance: 0 };
    byAccount[key].balance += Number(r.amount);
  });
  el.innerHTML = Object.values(byAccount)
    .sort((a, b) => b.balance - a.balance)
    .map(a => `<div class="savings-row"><span class="acct-name">🏦 ${esc(a.name)}</span><span class="acct-bal">${fmt(a.balance, a.currency)}</span></div>`)
    .join("");
}

// ---------- create / update / delete ----------
function resetForm() {
  editingId = null;
  document.getElementById("form-title").textContent = "➕ 手入力で追加(収入・貯蓄・現金払いなど)";
  document.getElementById("save-btn").textContent = "追加";
  document.getElementById("cancel-edit").style.display = "none";
  ["e-store", "e-amount", "e-memo", "e-account-name"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("e-type").value = "expense";
  document.getElementById("e-direction").value = "deposit";
  onTypeChange();
  document.getElementById("entry-err").textContent = "";
}
function startEdit(id) {
  const r = allRows.find(x => x.id === id);
  if (!r) return;
  editingId = id;
  document.getElementById("add-details").open = true;
  document.getElementById("form-title").textContent = `✏️ 編集中: ${r.store_name || r.account_name || r.purchased_at || "#" + id}`;
  document.getElementById("save-btn").textContent = "保存";
  document.getElementById("cancel-edit").style.display = "block";
  document.getElementById("e-type").value = r.entry_type || "expense";
  onTypeChange();
  document.getElementById("e-date").value = r.purchased_at || "";
  document.getElementById("e-store").value = r.store_name || "";
  document.getElementById("e-account-name").value = r.account_name || "";
  if (r.entry_type === "saving") {
    document.getElementById("e-direction").value = Number(r.amount) < 0 ? "withdraw" : "deposit";
  }
  document.getElementById("e-amount").value = Math.abs(r.amount);
  document.getElementById("e-currency").value = r.currency;
  document.getElementById("e-category-major").value = r.category_major;
  onMajorChange();
  document.getElementById("e-category-sub").value = r.category_sub;
  document.getElementById("e-memo").value = r.memo || "";
  document.getElementById("add-details").scrollIntoView({ behavior: "smooth" });
}
async function saveEntry() {
  const errEl = document.getElementById("entry-err");
  errEl.textContent = "";
  const type = document.getElementById("e-type").value;
  const rawAmount = parseFloat(document.getElementById("e-amount").value);
  if (!rawAmount || rawAmount <= 0) { errEl.textContent = "金額を入力してください"; return; }
  const accountName = document.getElementById("e-account-name").value.trim();
  if (type === "saving" && !accountName) { errEl.textContent = "口座名を入力してください"; return; }

  const payload = {
    entry_type: type,
    purchased_at: document.getElementById("e-date").value || null,
    store_name: type === "saving" ? null : (document.getElementById("e-store").value.trim() || null),
    account_name: type === "saving" ? accountName : null,
    amount: type === "saving" && document.getElementById("e-direction").value === "withdraw" ? -rawAmount : rawAmount,
    currency: document.getElementById("e-currency").value,
    category_major: document.getElementById("e-category-major").value,
    category_sub: document.getElementById("e-category-sub").value,
    memo: document.getElementById("e-memo").value.trim() || null,
  };
  const q = editingId
    ? db.from("kakeibo_transactions").update(payload).eq("id", editingId)
    : db.from("kakeibo_transactions").insert(payload);
  const { error } = await q;
  if (error) { errEl.textContent = "保存エラー: " + error.message; return; }
  resetForm();
  await reload();
}
async function removeEntry(id) {
  const r = allRows.find(x => x.id === id);
  if (!confirm(`削除しますか?\n${r?.purchased_at || ""} ${r?.store_name || ""} ${r ? fmt(r.amount, r.currency) : ""}`)) return;
  const { error } = await db.from("kakeibo_transactions").delete().eq("id", id);
  if (error) { alert("削除エラー: " + error.message); return; }
  await reload();
}

init();
</script>
